name: Sync and deploy

# Rebuilds the catalog from the official channels and publishes the site to
# GitHub Pages. It does nothing until the repository variable PAGES_ENABLED is
# set to "true" (Settings > Secrets and variables > Actions > Variables), so
# the site is never made public by accident. See docs/DEPLOYMENT.md.

on:
  push:
    branches: [main]
  schedule:
    # Every three hours. Games end late in US time, so recaps keep arriving overnight.
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The previous run's catalog makes the sync incremental. A cache miss just means a full rebuild.
      - uses: actions/cache@v4
        with:
          path: data/catalog.json
          key: catalog-${{ github.run_id }}
          restore-keys: catalog-
      # Uses the Data API when the YOUTUBE_API_KEY secret exists, the keyless feeds otherwise.
      - run: npm run sync
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
