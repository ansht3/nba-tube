name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # The same unit and integration tests, with a coverage summary in the log. There is no threshold yet: a number
      # chosen before the baseline was known would be arbitrary, and a failing gate would hide real failures.
      - run: npm run test:coverage
      # CI builds from the committed seed catalog. No API key is needed or used.
      - run: npm run build
      # The Cloudflare Worker is bundled separately from the site; a break in its imports would otherwise show up only at deploy.
      - run: npm run build:worker
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
