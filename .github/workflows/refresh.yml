name: Refresh videos

# Every 10 minutes (GitHub may run it less often), checks the official channels
# for videos the live site does not have, and asks Vercel to rebuild when there
# are some. The rebuild runs the sync, so no commit is needed.
#
# This job is red whenever the refresh is not really working:
#   - the deploy hook or SITE_URL is missing (nothing could be published),
#   - the hook request fails,
#   - a video has been missing for over an hour (rebuilds are not publishing).
# A green run means: configuration present, and nothing is stuck.
#
# Setup (Settings > Secrets and variables > Actions), details in docs/DEPLOYMENT.md:
#   secret   VERCEL_DEPLOY_HOOK  the Deploy Hook URL from Vercel (Project > Settings > Git)
#   variable SITE_URL            the production URL, e.g. https://nba-tube.vercel.app

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Require configuration
        env:
          # The hook URL is a secret. It is given only to the steps that use it, not to the whole job, so installing
          # packages and third-party actions never see it.
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          missing=""
          [ -z "$HOOK" ] && missing="$missing VERCEL_DEPLOY_HOOK (secret)"
          [ -z "$SITE_URL" ] && missing="$missing SITE_URL (variable)"
          if [ -n "$missing" ]; then
            echo "::error title=Refresh is not configured::Missing:$missing. New videos will not be published until this is set. See docs/DEPLOYMENT.md."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: check
        run: npm run --silent check-updates
      - name: Ask Vercel to rebuild
        if: steps.check.outputs.changed == 'true'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        # A hung request must not hold the job until its 10-minute limit.
        run: curl --fail --silent --show-error --max-time 30 --retry 2 -X POST "$HOOK" > /dev/null && echo "Rebuild requested."
      - name: Fail when the refresh is not keeping up
        if: steps.check.outputs.status == 'stuck' || steps.check.outputs.status == 'unreachable'
        # Values go in through the environment, never spliced into the script text.
        env:
          STATUS: ${{ steps.check.outputs.status }}
          PENDING: ${{ steps.check.outputs.pending }}
          OLDEST: ${{ steps.check.outputs.oldest_pending_minutes }}
        run: |
          echo "::error title=Refresh is not keeping up::status=$STATUS, $PENDING video(s) waiting, the oldest $OLDEST minutes since upload. A rebuild was requested if the hook is set; check the Vercel deployments and the latest build log."
          exit 1
